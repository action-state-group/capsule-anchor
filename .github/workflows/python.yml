# SPDX-License-Identifier: Apache-2.0
name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: install capsule-anchor
        run: pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        run: python -m pytest -q

  # The same suite against Postgres (#116): every Postgres-backed test runs
  # here, each in a schema of its own (packages/tests/conftest.py).
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capsule_anchor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAPSULE_ANCHOR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/capsule_anchor_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install capsule-anchor with Postgres support
        run: pip install -e ".[dev,postgres]"

      - name: pytest against Postgres
        run: python -m pytest -q -rs
