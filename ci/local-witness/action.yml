# SPDX-License-Identifier: Apache-2.0
name: Local witness for CI
description: >-
  Start this repository's witness service inside the calling job, over TLS on
  localhost, so a test that registers checkpoints never posts to the hosted
  production witness (capsule-anchor#109). Pair it with ci/local-witness/check
  after the step that registers, to fail the job unless this witness answered.
inputs:
  block-production:
    description: >-
      Map witness., anchor. and ts.agentactioncapsule.org (one hosted service)
      to an unroutable address in /etc/hosts for the rest of the job, so a call
      that still reaches for production fails instead of passing silently.
    default: "true"
outputs:
  url:
    description: The witness base URL, https://localhost:<port>.
    value: ${{ steps.start.outputs.url }}
  public-key:
    description: >-
      The witness authority's Ed25519 public key, 64 hex characters (the form
      capsulectl's --checkpoint-public-key and a profile's checkpoint.public_key take).
    value: ${{ steps.start.outputs.public-key }}
  ca-bundle:
    description: >-
      Absolute path of a PEM bundle: the system roots plus this witness's
      certificate. Set SSL_CERT_FILE to it in the steps that talk to the witness
      (Go's default transport and httpx read it on Linux).
    value: ${{ steps.start.outputs.ca-bundle }}
  log:
    description: Absolute path of the witness's log (uvicorn access lines included).
    value: ${{ steps.start.outputs.log }}
runs:
  using: composite
  steps:
    - id: start
      shell: bash
      env:
        SRC: ${{ github.action_path }}/../..
        BLOCK: ${{ inputs.block-production }}
      run: bash "${{ github.action_path }}/start.sh"
