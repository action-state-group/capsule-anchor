[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-anchor"
version = "0.1.0"
description = "Neutral public SCITT Transparency Service — submit digest → RFC9162 COSE Receipt"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group, Inc.", email = "opensource@actionstate.ai" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "cryptography>=42.0",
    "httpx>=0.27",
    # SCITT COSE Receipt: COSE_Sign1 / inclusion-proof CBOR encoding
    # (draft-ietf-cose-merkle-tree-proofs). Pure-Python, no native deps.
    "cbor2>=5.5",
    # Independent COSE_Sign1 decode + verify for the /checkpoints witness
    # route ([cll-checkpoint-cose-wire] wire alignment) -- generic SCITT
    # Signed Statement machinery only; capsule-anchor never imports
    # capsule-emit (boundary rule: the witness verifies what a stranger's
    # bytes claim, not what a trusted co-deployed library says about them).
    "scitt-cose>=0.2.2",
    # Checkpoint-aware witness (stage 2, [capsule-anchor-checkpoint-aware-witness]):
    # the neutral CLL core's PURE consistency-proof verification math
    # (cll.checkpoint.core.verify_consistency) -- imported, never
    # reimplemented, per the ruling's "the witness never builds trees".
    # Distinct from the capsule-emit boundary rule above: cll is the shared
    # neutral spec core both capsule-anchor and capsule-emit depend on
    # independently, not a co-deployed product library.
    "checkpointed-local-log>=0.3.0",
    # The countersign module ingests the canonical AAC Evidence Bundle
    # (-00 / v2, the same shape capsule-cli's `capsulectl bundle` produces)
    # -- its digest (JCS-canonical) and structural/completeness verification
    # (graph closure, CLL #13 range proof, per-record inclusion proof) are
    # imported from the neutral reference library, never reimplemented here
    # ([countersign-whole-bundle-shape]): a second JCS/MMR implementation in
    # this repo is exactly the kind of divergence that made the ad-hoc
    # bundle model this replaces reject 100% of capsulectl's real output.
    "agent-action-capsule>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-anchor"
Source = "https://github.com/action-state-group/capsule-anchor"
Specification = "https://github.com/action-state-group/agent-action-capsule"
Organization = "https://github.com/action-state-group"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4,<0.16",
]
# Durable Postgres/Cloud SQL CT-log persistence (psycopg v3 direct).
# Without this extra the service uses in-memory storage (state lost on restart).
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
capsule-anchor = "capsule_anchor.app:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
capsule_anchor = ["static/*.html", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"
